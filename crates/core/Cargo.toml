[package]
name = "arena-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
# io-util: remote.rs reads a child's stdout/stderr itself (it keeps the `Child` so a
# timed-out one can be stopped gracefully). net: the snapshot's SSH-port reachability probe
# (a TCP connect + the server's greeting). Both already in the lock file via reqwest.
tokio = { workspace = true, features = ["io-util", "net"] }
async-trait.workspace = true
thiserror.workspace = true
# SHA-256 for `arena update`'s checksum check (update.rs). Already in the lock file via
# reqwest's rustls.
ring = "0.17"
# `arena update`'s build-provenance check (attest.rs): Sigstore's own bundle verifier, from the
# sigstore org's sigstore-rust (sigstore-rs, the older `sigstore` crate, doesn't check the Rekor
# inclusion proof or SET, and matches only an attestation's first subject). Without default
# features: no TUF client or HTTP stack of its own (the public-good trust root it ships is
# compiled in), and aws-lc-rs as its crypto (a C build like ring's; no OpenSSL). It re-exports
# the trust root and bundle types (`sigstore_verify::{trust_root, types}`). Pinned exactly: a
# new version is a deliberate edit here, read first (Dependabot's `verification` group).
sigstore-verify = { version = "=0.15.1", default-features = false, features = ["aws-lc-rs"] }

[target.'cfg(unix)'.dependencies]
# `kill(pid, SIGTERM)` for a graceful stop of a timed-out ssh/scp child (remote.rs);
# std/tokio only offer SIGKILL. Already in the lock file via tokio.
libc = "0.2"

[features]
# Test doubles (`remote::FakeRemote`) for downstream crates' tests. Enabled only from
# dev-dependencies, so it never ships in a release build.
test-util = []

[dev-dependencies]
# Paused-clock tests (`#[tokio::test(start_paused = true)]`): timeouts/retries run instantly.
tokio = { workspace = true, features = ["test-util"] }
