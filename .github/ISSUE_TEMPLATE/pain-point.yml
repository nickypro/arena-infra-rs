name: Pain point
description: arena got in your way, or you had to work around it. People and their agents are both welcome to file one.
title: "pain: "
labels: ["pain-point"]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public. Everything you write here can be read by anyone.**
        Leave out IP addresses, hostnames of private machines, API keys and tokens (revoked ones too), SSH keys, and participants' names, usernames or emails.
        Use placeholders instead: `<pod>`, `<ip>`, `<key>`, `<participant>`.
        Put private details (who, which box, production specifics) in your own operator notes, not here.
        For ARENA's operators that's `/srv/arena-ops-notes/YYYY-MM-DD-<topic>.md` on the control box.

        One problem per issue. Search the [open pain points](https://github.com/nickypro/arena-infra-rs/issues?q=is%3Aissue+is%3Aopen+label%3Apain-point) first, and add to an existing one if it fits.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: The goal, not the command. For example "move a participant to a bigger GPU mid-day" or "back up every pod before the weekend".
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: The command you ran and its output, trimmed to the part that matters. Use placeholders for anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: What you did instead, if anything. For example a manual step, a script, the provider's console, or giving up.
  - type: textarea
    id: wish
    attributes:
      label: What would you want arena to do?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: arena version
      description: The output of `arena --version`.
      placeholder: arena 2.2.261030.1500 (b0baa50a1c)
    validations:
      required: true
  - type: dropdown
    id: providers
    attributes:
      label: Provider(s)
      multiple: true
      options:
        - RunPod
        - Vast.ai
        - Hetzner
        - Shadeform
        - Not provider-specific
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed IPs, private hostnames, keys and tokens, and participants' names and emails.
          required: true
