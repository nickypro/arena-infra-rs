# Release: every green master commit becomes the GitHub release `arena update` installs.
#
# After CI passes on a push to master (`workflow_run`), this builds `arena` + `arena-tui` for
# Linux x86_64 and arm64 on Ubuntu 22.04 (glibc 2.35: they run on 22.04 and newer, prod's
# arm64 24.04 included) and publishes them with CHANGELOG.md and SHA256SUMS under the tag
# v<version>. The version is the commit's time in UTC (crates/cli/build.rs), so one commit is
# always one version.
#
# Build provenance is attested (Sigstore, logged in Rekor): one statement naming every
# `dist/arena-*` file and CHANGELOG.md. `arena update` refuses binaries that statement doesn't
# prove, and a CHANGELOG.md other than the one it names (crates/core/src/attest.rs; by hand:
# docs/REFERENCE.md, `update`). It pins who signed: this file, `.github/workflows/release.yml`,
# started by `workflow_run`, on `refs/heads/master` of this repository (by GitHub's id for it,
# 1368824951), on a GitHub-hosted runner; and both binaries named, with their digests, in the
# one statement. Renaming or moving this file, another
# trigger, releasing from another branch, a self-hosted runner, attesting the binaries
# separately, or a re-created repository makes every existing build refuse the new releases
# (until `arena update --skip-attestation <sha256>,<sha256>`): change `attest::RELEASE` with it,
# and expect one manual update. The `if:` below (a CI run of a push to master) is what decides
# which code a release builds: the certificate can't tell.
#
# On a pull request that touches this file or build.rs, it builds and checks the binaries and
# publishes nothing.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  pull_request:
    paths: [".github/workflows/release.yml", "crates/cli/build.rs"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The toolchain CI and the dev machine use (see ci.yml).
  RUSTUP_TOOLCHAIN: "1.96.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    # Only a CI run that passed, on a push (not a PR's run), becomes a release.
    if: github.event_name == 'pull_request' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version
      - name: Stamp
        # The commit's own time, so a rebuild of the same commit is the same version.
        run: |
          echo "ARENA_BUILD_STAMP=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%y%m%d.%H%M)" >> "$GITHUB_ENV"
          echo "ARENA_GIT_SHA=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --bin arena --bin arena-tui
      - name: Package
        run: |
          mkdir dist
          cp target/release/arena "dist/arena-${{ matrix.target }}"
          cp target/release/arena-tui "dist/arena-tui-${{ matrix.target }}"
          "dist/arena-${{ matrix.target }}" --version
          "dist/arena-${{ matrix.target }}" --version | grep -qx "arena 2.0.$ARENA_BUILD_STAMP ($ARENA_GIT_SHA)"
          echo "needs glibc: $(objdump -T "dist/arena-${{ matrix.target }}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arena-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The previous release's tag, for the notes.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Version
        # Artifacts don't keep the executable bit; the x86_64 build runs here.
        run: |
          chmod +x dist/arena-x86_64-unknown-linux-gnu
          version=$(dist/arena-x86_64-unknown-linux-gnu --version | awk '{print $2}')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "arena $version"
      - name: Checksums
        run: |
          cp CHANGELOG.md dist/
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # One statement naming every binary and the changelog: `arena update` requires both
          # binaries in one statement, and shows the changelog as verified when it's named.
          subject-path: |
            dist/arena-*
            dist/CHANGELOG.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released: nothing to publish"
            exit 0
          fi
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          {
            echo 'Install or update with `arena update` (it shows what changed and checks `SHA256SUMS`).'
            echo 'Operator notes are in `CHANGELOG.md`.'
            if [ -n "$prev" ]; then
              echo
              echo "Merged since $prev:"
              git log --first-parent --format='- %s' "$prev..$SHA"
            fi
          } > notes.md
          gh release create "$tag" dist/* --target "$SHA" --title "arena $VERSION" --notes-file notes.md --latest
