# CI: the same gate every change passes locally before a push — the full test suite in release
# mode with zero warnings (it builds the release binaries too, for the tests that run them), and
# clippy with zero warnings, on the tests and on the code as shipped. Hermetic: no provider keys, no
# network calls (the live smoke test is `#[ignore]` and also guarded by ARENA_LIVE_SMOKE), so
# it's safe on a public repo and on PRs.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned to the toolchain the code is developed on (rust-toolchain.toml says "stable", which
  # would float): a newer compiler's new lints must not turn CI red without a code change.
  # Bump this together with the dev machine's toolchain.
  RUSTUP_TOOLCHAIN: "1.96.0"

jobs:
  test:
    name: build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Same rule as the local gate: any compiler warning fails.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version
      # Tests drive real rsync/flock/ssh-keygen/git; git commits need an identity. zsh, fish and
      # busybox are the login shells the ssh transport is tested under (ARENA_TEST_ALL_SHELLS
      # below makes a missing one a failure, not a skip).
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q rsync zsh fish busybox
          git config --global user.name "arena CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        env:
          ARENA_TEST_ALL_SHELLS: "1"
        run: cargo test --release --locked

  # The macOS build release.yml ships, tested on Apple silicon alongside the Linux job. Tests of
  # what only Linux has (`/proc`, `script`'s flags, …) are gated off macOS: docs/REFERENCE.md,
  # "On macOS", lists them. The macOS jobs run once per commit, on its push (macOS runners are
  # few); a fork's pull request has no push here, so it runs them itself.
  test-macos:
    name: build + test (macOS)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version
      # rsync 3: macOS's own is openrsync, without the `--info` and `-J` arena's pulls use (a Mac
      # pulling backups needs it too: README). GNU coreutils, sed, grep and find, first on PATH:
      # the tests run the pods' scripts here as a stand-in pod, and a pod is Linux.
      - name: Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install rsync coreutils gnu-sed grep findutils
          for f in coreutils gnu-sed grep findutils; do echo "$(brew --prefix "$f")/libexec/gnubin" >> "$GITHUB_PATH"; done
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          git config --global user.name "arena CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: |
          rsync --version | head -1 && sed --version | head -1
          cargo test --release --locked --no-fail-fast

  # Blocking: any clippy warning fails the run. The lint set is the pinned toolchain's
  # (RUSTUP_TOOLCHAIN), so a newer clippy's new lints arrive only with a deliberate bump.
  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # The tests turn on core's `test-util` (its test doubles) through the CLI's and the
      # dashboard's dev-dependencies, so neither the test build nor the run above compiles the
      # code as shipped: this does, as `cargo build --release` would (a test double used by
      # shipped code fails here, as does code only the doubles use).
      - name: Clippy, as shipped
        run: cargo clippy --locked -- -D warnings

  # The same on macOS: its `#[cfg]`s compile other code.
  clippy-macos:
    name: clippy (macOS)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy, as shipped
        run: cargo clippy --locked -- -D warnings
